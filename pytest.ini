[pytest]
# Collect only the real test folder.
#
# `release/` holds packaged copies of earlier versions, each with its own
# tests/ directory. Without this, pytest walks into one of those first, imports
# `test_app` from the copy, then refuses the real `tests/test_app.py` because a
# module of that name is already loaded -- the test files have no package
# `__init__.py`, so their basename *is* their module name. The old folders are
# archives, not a second suite, so nothing should be collected from them.
testpaths = tests
norecursedirs = .venv build dist release v0.* __pycache__ .git .pytest_cache
